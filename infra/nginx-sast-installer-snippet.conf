# Install on THIS host: put inside existing `server { ... }`
# Adjust path after `alias` if your .exe moves.
#
#   include /path/to/sast_tech/infra/nginx-sast-installer-snippet.conf;

location = /SAST.ai-Setup-0.0.72.exe {
    alias /home/ubuntu/sast/SAST.ai-Setup-0.0.72.exe;
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="SAST.ai-Setup-0.0.72.exe"';
    limit_except GET { deny all; }
}
