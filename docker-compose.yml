# Supabase vars: optional project `.env` (same folder) overrides placeholders for real auth.
# Installer: host folder (default /home/ubuntu/sast) → /installer in container. Override: SAST_HOST_INSTALLER_DIR
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.replace-with-your-anon-key}
        SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-replace-with-service-role}
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://example.supabase.co}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.replace-with-your-anon-key}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-replace-with-service-role}
      SAST_WINDOWS_INSTALLER_PATH: /installer/SAST.ai-Setup-0.0.72.exe
      HOSTNAME: 0.0.0.0
    volumes:
      - ${SAST_HOST_INSTALLER_DIR:-/home/ubuntu/sast}:/installer:ro
    restart: unless-stopped
